name: Publish to GitHub Pages
# The live site is served from the gh-pages branch. Every push to main is
# copied there, so a change goes live about a minute after it is pushed.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git push origin HEAD:gh-pages --force
