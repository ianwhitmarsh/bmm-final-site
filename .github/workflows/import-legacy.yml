name: Import pages from the old Vercel projects
# One-off: copies the case studies, blog posts, blogs, careers, privacy and
# landing pages into this repo so the whole site lives in one place.
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-legacy.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
