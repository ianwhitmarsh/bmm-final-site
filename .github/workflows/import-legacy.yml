            fetch "https://bmm-main-1.vercel.app/blogs.html" "blogs.html"
            fetch "https://bmm-main-1.vercel.app/careers.html" "careers.html"
            fetch "https://bmm-main-3.vercel.app/privacy-policy.html" "privacy-policy.html"
            fetch "https://bmm-main-3.vercel.app/tulsa-social-media-landing.html" "tulsa-social-media-landing.html"
            fetch "https://bmm-main-4.vercel.app/careers/facebook-%28meta%29-ads-manager.html" "careers/facebook-(meta)-ads-manager.html"
          ls -R works blogs careers | head -80
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import case studies, blog posts and other pages from the old Vercel projects" || exit 0
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
